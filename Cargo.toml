[workspace]
members = [
  "crates/kernel",
  "crates/uefi-boot"
]
resolver = "2"
[profile.dev.package.bootloader]
# Compile bootloader once, quickly, and keep it stable in cache
opt-level = 3
codegen-units = 1
debug = false

[profile.dev.package.bootloader_api]
opt-level = 3
codegen-units = 1
debug = false
