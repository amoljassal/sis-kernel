# Production Environment Configuration
# Multi-AI Synthesized Production Setup
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sis-production
  annotations:
    config.kubernetes.io/local-config: "true"
    sis.platform/ai-consultation: "all-four-consensus"

# Namespace for production
namespace: sis-production

# Common labels for all resources
commonLabels:
  app.kubernetes.io/name: sis-ai-lab
  app.kubernetes.io/version: "v7.0.0"
  app.kubernetes.io/component: production
  app.kubernetes.io/part-of: sis-platform
  app.kubernetes.io/managed-by: argocd
  sis.platform/environment: production
  sis.platform/ai-optimized: "true"

# Base resources
resources:
- ../base
- ../../services/ai-gateway/production
- ../../services/api/production  
- ../../services/websocket/production
- ../../services/collaboration/production
- ../../monitoring/production
- ../../security/production

# Production-specific patches
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 10
  target:
    kind: Deployment
    name: sis-api
- patch: |-
    - op: replace
      path: /spec/strategy
      value:
        blueGreen:
          activeService: sis-api-active
          previewService: sis-api-preview
          autoPromotionEnabled: false
          scaleDownDelaySeconds: 300
          prePromotionAnalysis:
            templates:
            - templateName: educational-health-check
            args:
            - name: service-name
              value: sis-api-preview
  target:
    kind: Rollout
    name: sis-api

# Production-specific configuration
configMapGenerator:
- name: sis-production-config
  literals:
  - ENVIRONMENT=production
  - LOG_LEVEL=info
  - AI_GATEWAY_ENABLED=true
  - PREDICTIVE_SCALING=true
  - SELF_HEALING=true
  - EDUCATIONAL_MODE=true
  - MAX_CONCURRENT_STUDENTS=100000
  - GLOBAL_REGIONS=us-east-1,eu-west-1,ap-south-1
  - MULTI_AI_FEATURES=gemini,chatgpt,claude,grok

# Secret configurations
secretGenerator:
- name: sis-production-secrets
  files:
  - ai-gateway-key=../../secrets/ai-gateway-key
  - database-password=../../secrets/database-password
  - redis-password=../../secrets/redis-password
  options:
    disableNameSuffixHash: true

# Resource transformations
images:
- name: sis-ai-lab/api
  newTag: "v7.0.0-production"
- name: sis-ai-lab/ai-gateway  
  newTag: "v7.0.0-production"
- name: sis-ai-lab/websocket
  newTag: "v7.0.0-production"
- name: sis-ai-lab/collaboration
  newTag: "v7.0.0-production"

# Replicas for production scale
replicas:
- name: sis-api
  count: 10
- name: sis-ai-gateway
  count: 8
- name: sis-websocket
  count: 12
- name: sis-collaboration
  count: 6