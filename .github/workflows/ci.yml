name: SIS Kernel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sis-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: nightly-2024-12-15
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "true"
  QEMU_AUDIO_DRV: none
  FORCE_BOOTIMG: "1"
  TIMEOUT: "60"

jobs:
  lint:
    name: Lint (fmt + clippy minimal)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: sis-kernel-${{ env.RUST_TOOLCHAIN }}

      - name: rustfmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (ci-lint-min)
        run: cargo clippy --no-default-features --features "ci-lint-min" -- -D warnings

  build-matrix:
    name: Build-only (${{ matrix.flavor }})
    runs-on: ubuntu-22.04
    needs: [ lint ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: "minimal"
            features: ""
          - flavor: "userland"
            features: "userland"
          - flavor: "smp"
            features: "apic smp"
          - flavor: "vfio"
            features: "vfio iommu qemu-intel-iommu-sim apic"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: sis-kernel-${{ env.RUST_TOOLCHAIN }}

      - name: Build (no run)
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -euxo pipefail
          if [ -n "${FEATURES}" ]; then
            cargo build --target x86_64-unknown-none --features "${FEATURES}"
          else
            cargo build --target x86_64-unknown-none
          fi

  userland:
    name: Userland tests (${{ matrix.test }})
    runs-on: ubuntu-22.04
    needs: [ build-matrix ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: USR_INIT
            features: "userland selftests"
            timeout: "45"
          - test: USR_SPAWN_TWO
            features: "userland selftests"
            timeout: "45"
          - test: USR_ELF_EDGES
            features: "userland selftests"
            timeout: "45"
          - test: USR_VFS_NEG
            features: "userland selftests"
            timeout: "45"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: sis-kernel-${{ env.RUST_TOOLCHAIN }}
      - name: Run ${{ matrix.test }}
        env:
          TEST: ${{ matrix.test }}
          FEATURES: ${{ matrix.features }}
          TIMEOUT: ${{ matrix.timeout }}
          FORCE_BOOTIMG: "1"
        run: |
          set -euxo pipefail
          ./scripts/qemu.sh
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.test }}
          path: out/qemu-serial.log
          if-no-files-found: warn
          retention-days: 7

  smp:
    name: SMP tests (${{ matrix.test }})
    runs-on: ubuntu-22.04
    needs: [ userland ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: SMP_ONLINE
            features: "apic smp idt-selftest selftests"
            cpus: 2
            timeout: "60"
          - test: IPC_XCPU_PING
            features: "apic smp ipc idt-selftest selftests"
            cpus: 2
            timeout: "60"
          - test: TLB_SHOOTDOWN
            features: "apic smp idt-selftest selftests"
            cpus: 2
            timeout: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: sis-kernel-${{ env.RUST_TOOLCHAIN }}
      - name: Run ${{ matrix.test }}
        env:
          TEST: ${{ matrix.test }}
          FEATURES: ${{ matrix.features }}
          QEMU_SMP: ${{ matrix.cpus }}
          TIMEOUT: ${{ matrix.timeout }}
          FORCE_BOOTIMG: "1"
        run: |
          set -euxo pipefail
          ./scripts/qemu.sh
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.test }}
          path: out/qemu-serial.log
          if-no-files-found: warn
          retention-days: 7

  vfio:
    name: VFIO/MSI tests (${{ matrix.test }})
    runs-on: ubuntu-22.04
    needs: [ smp ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: IOMMU_PROBE
            features: "vfio iommu qemu-intel-iommu-sim apic idt-selftest selftests"
            timeout: "60"
          - test: VFIO_BIND_E1000
            features: "vfio iommu qemu-intel-iommu-sim apic idt-selftest selftests"
            timeout: "60"
          - test: VFIO_MSI_SMOKE
            features: "vfio iommu qemu-intel-iommu-sim apic idt-selftest selftests"
            timeout: "90"
          - test: VFIO_MSI_SOAK
            features: "vfio iommu qemu-intel-iommu-sim apic idt-selftest selftests"
            timeout: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: sis-kernel-${{ env.RUST_TOOLCHAIN }}
      - name: Run ${{ matrix.test }}
        env:
          TEST: ${{ matrix.test }}
          FEATURES: ${{ matrix.features }}
          TIMEOUT: ${{ matrix.timeout }}
          QEMU_MACHINE_HINT: q35
          QEMU_IRQCHIP_HINT: split
          FORCE_BOOTIMG: "1"
        run: |
          set -euxo pipefail
          ./scripts/qemu.sh
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.test }}
          path: out/qemu-serial.log
          if-no-files-found: warn
          retention-days: 7