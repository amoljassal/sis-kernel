name: SIS Kernel CI (Phase 7+ Ready)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly "soak" to catch toolchain drift while keeping the fast lane snappy
    # Note: Automated lint baseline runs separately via lint-baseline.yml workflow
    - cron: "17 3 * * 1"

jobs:
  # ---------- Toolchain setup anchor to keep versions consistent ----------
  _toolchain:
    name: Setup toolchain (anchor)
    runs-on: ubuntu-22.04
    outputs:
      rustc: ${{ steps.versions.outputs.rustc }}
      cargo: ${{ steps.versions.outputs.cargo }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (nightly pinned)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-08-01
          components: clippy,rustfmt,rust-src
      - name: Add targets
        run: |
          rustup target add x86_64-unknown-none
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: nightly-2025-08-01
      - name: Versions
        id: versions
        run: |
          echo "rustc=$(rustc -V)" >> $GITHUB_OUTPUT
          echo "cargo=$(cargo -V)" >> $GITHUB_OUTPUT

  # ---------- Fast lane (blocking) ----------
  lint-min:
    name: Lint (minimal)
    runs-on: ubuntu-22.04
    needs: [_toolchain]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-08-01
          components: clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-2025-08-01
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (ci-lint-min)  
        run: cargo clippy --target x86_64-unknown-none --no-default-features --features "ci-lint-min" -Z build-std=core,alloc -- -A warnings

  build-min:
    name: Build (minimal)
    runs-on: ubuntu-22.04
    needs: [lint-min]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-08-01
          components: rust-src
      - name: Add rust-src component (backup)
        run: rustup component add rust-src --toolchain nightly-2025-08-01
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-2025-08-01
      - name: Build (no default features)
        run: cargo build --target x86_64-unknown-none --no-default-features -Z build-std=core,alloc

  userland-smoke:
    name: Userland smoke (USR_INIT)
    runs-on: ubuntu-22.04
    needs: [build-min]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-08-01
          components: rust-src
      - name: Add rust-src component (backup)
        run: rustup component add rust-src --toolchain nightly-2025-08-01
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-2025-08-01
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Build (userland)
        run: cargo build --target x86_64-unknown-none --features "userland selftests" -Z build-std=core,alloc
      - name: Run USR_INIT (headless)
        env:
          TEST: USR_INIT
          FEATURES: "userland selftests"
          TIMEOUT: "45"
          FORCE_BOOTIMG: "1"
        run: ./scripts/qemu.sh
      - name: Upload artifacts (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usr-init-artifacts
          path: |
            out/qemu-serial.log
            out/*.img
            out/*.json

  # ---------- Extended lane (non-blocking; shows failures but doesn't break the green check) ----------
  extended-nonblocking:
    name: Extended (SMP/Scheduler/VFIO) – non-blocking
    runs-on: ubuntu-22.04
    needs: [userland-smoke]
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smp_ipc_ping
            TEST: IPC_XCPU_PING
            FEATURES: "apic smp selftests"
            QEMU_SMP: "2"
          - name: vfio_msi_smoke
            TEST: VFIO_MSI_SMOKE
            FEATURES: "vfio qemu-intel-iommu-sim apic selftests"
            QEMU_SMP: "1"
          - name: sched_fairness_meter
            TEST: SCHED_FAIR_METER
            FEATURES: "apic smp scheduler selftests"
            QEMU_SMP: "2"
          - name: smp_affinity_validation
            TEST: SMP_AFFINITY
            FEATURES: "apic smp affinity selftests"
            QEMU_SMP: "2"
          - name: preemptive_scheduling
            TEST: SCHED_PREEMPT_RR
            FEATURES: "apic smp scheduler selftests"
            QEMU_SMP: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-08-01
          components: rust-src
      - name: Add rust-src component (backup)
        run: rustup component add rust-src --toolchain nightly-2025-08-01
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-2025-08-01
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: "Build (matrix: ${{ matrix.name }})"
        run: |
          cargo build --target x86_64-unknown-none --features "${{ matrix.FEATURES }}" -Z build-std=core,alloc
      - name: "Run (matrix: ${{ matrix.name }})"
        env:
          TEST: ${{ matrix.TEST }}
          FEATURES: ${{ matrix.FEATURES }}
          QEMU_SMP: ${{ matrix.QEMU_SMP }}
          TIMEOUT: "60"
          FORCE_BOOTIMG: "1"
        run: ./scripts/qemu.sh
      - name: "Upload artifacts (${{ matrix.name }})"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            out/qemu-serial.log
            out/*.img
            out/*.json