name: SIS Kernel CI (Phase 7+ Ready)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly "soak" to catch toolchain drift while keeping the fast lane snappy
    # Note: Automated lint baseline runs separately via lint-baseline.yml workflow
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  # Hard pin the Rust toolchain we build with (matches rust-toolchain.toml)
  RUSTUP_TOOLCHAIN: nightly-2025-08-01

jobs:
  fast-lane:
    name: Fast Lane (lint + minimal + USR_INIT)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2025-08-01
          components: rustfmt, clippy, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Verify toolchain & components
        run: |
          set -euxo pipefail
          rustc -Vv
          cargo -V
          rustup show active-toolchain
          rustup component list --installed
          rustup target list --installed

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-cargo-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

      - name: Lint (minimal features)
        run: |
          set -euxo pipefail
          cargo fmt --all -- --check
          cargo clippy --target x86_64-unknown-none --no-default-features --features "ci-lint-min" -Z build-std=core,alloc -- -A warnings

      - name: Build (minimal features)
        run: |
          set -euxo pipefail
          cargo build --target x86_64-unknown-none --no-default-features -Z build-std=core,alloc

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Build (userland features)
        env:
          RUSTFLAGS: "--cfg ci_fast"
        run: |
          set -euxo pipefail
          cargo build --target x86_64-unknown-none --features "userland selftests" -Z build-std=core,alloc

      - name: USR_INIT smoke (headless QEMU)
        env:
          TEST: USR_INIT
          FEATURES: "userland selftests"
          TIMEOUT: "45"
          FORCE_BOOTIMG: "1"
        run: |
          set -euxo pipefail
          echo "=== Starting USR_INIT test ==="
          ./scripts/qemu.sh || {
            echo "=== USR_INIT test failed with exit code $? ==="
            echo "=== Checking for output files ==="
            find out/ -name "*.log" -o -name "*.img" -o -name "*.json" 2>/dev/null || echo "No output files found"
            ls -la out/ 2>/dev/null || echo "out/ directory not found"
            exit $?
          }

      - name: Upload artifacts (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usr-init-artifacts
          path: |
            out/qemu-serial.log
            out/*.img
            out/*.json

  extended:
    name: Extended Lane (SMP + VFIO)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SMP IPC_XCPU_PING
            test: IPC_XCPU_PING
            features: "apic smp selftests"
            smp: 2
          - name: VFIO MSI SMOKE
            test: VFIO_MSI_SMOKE
            features: "vfio qemu-intel-iommu-sim apic selftests"
            smp: 1
          - name: SCHED_FAIR_METER
            test: SCHED_FAIR_METER
            features: "apic smp scheduler selftests"
            smp: 2
          - name: SMP_AFFINITY
            test: SMP_AFFINITY
            features: "apic smp affinity selftests"
            smp: 2
          - name: SCHED_PREEMPT_RR
            test: SCHED_PREEMPT_RR
            features: "apic smp scheduler selftests"
            smp: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2025-08-01
          components: rustfmt, clippy, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Verify toolchain & components
        run: |
          set -euxo pipefail
          rustc -Vv
          cargo -V
          rustup show active-toolchain
          rustup component list --installed
          rustup target list --installed

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-cargo-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Build (matrix features)
        env:
          RUSTFLAGS: "--cfg selftest_${{ matrix.test }} --cfg ci_fast"
        run: |
          set -euxo pipefail
          cargo build --target x86_64-unknown-none --features "${{ matrix.features }}" -Z build-std=core,alloc

      - name: Run selftest (${{ matrix.name }})
        env:
          TEST: ${{ matrix.test }}
          FEATURES: ${{ matrix.features }}
          QEMU_SMP: 1
          TIMEOUT: "120"
          FORCE_BOOTIMG: "1"
        run: |
          set -euxo pipefail
          ./scripts/qemu.sh

      - name: "Upload artifacts (${{ matrix.name }})"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            out/qemu-serial.log
            out/*.img
            out/*.json