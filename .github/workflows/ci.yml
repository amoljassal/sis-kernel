name: SIS Kernel CI

on:
  push:
  pull_request:

jobs:
  userland-tests:
    name: USR_* (${{ matrix.test }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    env:
      # Make warnings fail in clippy; normal build/test can stay permissive if you want.
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: nightly-2024-12-15
      FEATURES: userland
      TEST: ${{ matrix.test }}
      TIMEOUT: "40"          # seconds; bump if needed

    strategy:
      fail-fast: false
      matrix:
        test: [USR_INIT, USR_SPAWN_TWO, USR_ELF_EDGES, USR_VFS_NEG]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Rust (pinned nightly + components)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-12-15
          components: rust-src, llvm-tools-preview, clippy, rustfmt

      - name: Install bootimage (pinned)
        run: cargo install bootimage --version 0.10.3 --locked

      # --- QUALITY GATES ---
      - name: rustfmt (workspace)
        run: cargo fmt --all -- --check

        # Clippy may need features to see kernel paths. We lint the default profile
        # (no tests) for speed; you can add more feature sets later if desired.
      - name: clippy (deny warnings)
        run: RUSTFLAGS="-D warnings" cargo clippy --all-targets --no-deps

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Build dependencies
        run: cargo build --target x86_64-unknown-none --features ${FEATURES}

      - name: Build bootable image (BIOS / bootloader 0.10.x)
        run: cargo bootimage --features ${FEATURES}

      - name: Run headless QEMU via harness
        run: |
          set -euo pipefail
          mkdir -p out
          # Harness should create out/qemu-serial.log and exit with our golden code.
          # It should also pick the newest bootimage-*.bin internally or you can pass it.
          # Example direct pass (uncomment if your harness expects a file argument):
          # IMG=$(ls -t target/x86_64-unknown-none/debug/bootimage-*.bin | head -n1)
          # BOOTIMG="$IMG" TEST="${TEST}" FEATURES="${FEATURES}" TIMEOUT="${TIMEOUT}" ./scripts/qemu.sh
          CARGO_NET_OFFLINE=false TEST="${TEST}" FEATURES="${FEATURES}" TIMEOUT="${TIMEOUT}" ./scripts/qemu.sh
          echo "Run completed for ${TEST}"
        shell: bash

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.test }}
          path: out/qemu-serial.log

